<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Content-Security-Policy: adjust if you add more CDNs or inline scripts -->
  <meta http-equiv="Content-Security-Policy" content="
          default-src 'self';
          script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com https://accounts.google.com https://connect.facebook.net
                     https://www.googletagmanager.com https://www.recaptcha.net;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com https://frontend-cdn.perplexity.ai;
          img-src 'self' data: blob: http://localhost:8000 https://api.pyonea.com https://www.google-analytics.com https://www.google.co.th https://www.google.com https://www.google.com.mm https://www.google.de https://www.google.ru https://stats.g.doubleclick.net https://api.qrserver.com;
          connect-src 'self' http://localhost:8000 https://api.pyonea.com https://www.google-analytics.com https://region1.analytics.google.com
                      https://www.googleapis.com wss://api.pyonea.com
                      https://analytics.google.com https://stats.g.doubleclick.net
                      https://www.google.com https://www.google.com.mm https://accounts.google.com;
          frame-src https://www.google.com https://www.recaptcha.net https://accounts.google.com;
          object-src 'none';
          base-uri 'self';
          form-action 'self';
        ">
  <meta name="facebook-domain-verification" content="ngocovzflx88q1cdm0ahzdhuh6fy90" />


  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Default fallback title -->
  <title>Pyonea Marketplace | Buy & Sell Products in Myanmar</title>

  <!-- Default description fallback -->
  <meta name="description"
    content="Buy and sell products easily across Myanmar with Pyonea marketplace. Discover trusted sellers and great deals." />

  <!-- Canonical -->
  <link rel="canonical" href="https://pyonea.com/?lang=en" />

  <!-- hreflang fallback -->
  <link rel="alternate" hreflang="en" href="https://pyonea.com/?lang=en" />
  <link rel="alternate" hreflang="my" href="https://pyonea.com/?lang=my" />
  <link rel="alternate" hreflang="x-default" href="https://pyonea.com/?lang=en" />

  <!-- Open Graph -->
  <meta property="og:title" content="Pyonea Marketplace" />
  <meta property="og:description" content="Buy and sell products easily across Myanmar with Pyonea marketplace." />
  <meta property="og:image" content="https://pyonea.com/og-image.png" />
  <meta property="og:url" content="https://pyonea.com/?lang=en" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="my_MM" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pyonea Marketplace" />
  <meta name="twitter:description" content="Buy and sell products easily across Myanmar with Pyonea marketplace." />
  <meta name="twitter:image" content="https://pyonea.com/og-image.png" />

  <!-- Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.pyonea.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.pyonea.com">

  <!-- Fonts -->
  <!-- Preload critical fonts so browser discovers them before CSS parses -->
  <link rel="preload" href="/src/fonts/NotoSansMyanmar/NotoSansMyanmar-Regular.woff2" as="font" type="font/woff2"
    crossorigin>
  <link rel="preload" href="/src/fonts/Torus/Torus-SemiBold.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Use http(s) dev/prod URL, not file:// — opening index.html from disk yields origin "null" and /manifest.json can fail CORS. -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Robots -->
  <meta name="robots" content="index, follow" />

  <!-- Base JSON-LD -->
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "name": "Pyonea Marketplace",
      "url": "https://pyonea.com",
      "logo": "https://pyonea.com/logo.png"
    },
    {
      "@type": "WebSite",
      "name": "Pyonea Marketplace",
      "url": "https://pyonea.com",
      "inLanguage": ["en", "my"],
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://pyonea.com/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  ]
}
</script>

</head>

<body>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>

</body>

</html>
